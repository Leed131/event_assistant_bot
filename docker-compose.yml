services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: event_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  bot:
    build: .
    env_file: .env
    depends_on:
      - db
volumes:
  pgdata:
