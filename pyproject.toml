[project]
name = "event-assistant-bot"
version = "0.1.0"
description = "Multi-user Telegram bot for discovering local events, saving registrations and tickets, and sending reminders."
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot[job-queue]>=21.6,<22",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
